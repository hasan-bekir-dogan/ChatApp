services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/chatapp
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in your environment}
      TRUST_PROXY: "true"
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads

volumes:
  mongo-data:
  uploads:
